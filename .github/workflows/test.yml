name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macos-15 ships Xcode 16.4, the oldest toolchain this package supports
  # (swift-tools-version 6.0). macos-26 ships the newest GA Xcode. Testing both
  # catches problems at either end.
  macos:
    name: macos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Build-only: confirms the package compiles for every platform Package.swift
  # declares, on both the oldest and newest Xcode. Tests already run on macOS
  # and Linux above.
  apple-platforms:
    name: ${{ matrix.destination }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        destination:
          - generic/platform=iOS
          - generic/platform=watchOS
          - generic/platform=tvOS
          - generic/platform=visionOS
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: xcodebuild build -scheme TimeLabels -destination "${{ matrix.destination }}"

  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test
